<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D4D4D4}
button{font:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0E0E; font-family: 'Manrope', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
  <div style="position: relative; height: 700px; border-radius: 0 0 28px 28px; overflow: hidden; flex-shrink: 0">
    <svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true" style="display: block">
      <rect width="360" height="640" fill="#F4C7A1"></rect>
      <circle cx="250" cy="250" r="56" fill="#FF8A5B"></circle>
      <path d="M0 380 C 80 330 160 360 220 400 C 280 440 330 410 360 390 L360 640 L0 640Z" fill="#5F7F6A"></path>
      <path d="M0 450 C 90 410 180 470 260 450 C 310 438 340 445 360 455 L360 640 L0 640Z" fill="#3B5847"></path>
      <path d="M0 540 C 120 510 240 560 360 530 L360 640 L0 640Z" fill="#26392E"></path>
    </svg>
    <div aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr))">
      <div style="border-right: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-right: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-bottom: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-right: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-right: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-bottom: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-right: 1px solid rgba(255,255,255,0.35)"></div>
      <div style="border-right: 1px solid rgba(255,255,255,0.35)"></div>
      <div></div>
    </div>
    <div style="position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center">
      <button aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.4); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <button aria-label="Flash off" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.4); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path><path d="M3 3l18 18"></path></svg>
      </button>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 40px">
    <span aria-hidden="true" style="width: 48px; height: 48px; display: block"></span>
    <a href="Draw.html" aria-label="Take photo" style="width: 80px; height: 80px; border-radius: 40px; border: 4px solid #FFFFFF; background: transparent; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <span style="width: 62px; height: 62px; border-radius: 31px; background: #FFFFFF; display: block"></span>
    </a>
    <button aria-label="Switch camera" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #262626; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5"></path></svg>
    </button>
  </div>
</div>


</body>
</html>
