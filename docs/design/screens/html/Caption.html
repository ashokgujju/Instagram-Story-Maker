<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Write a caption</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D4D4D4}
button{font:inherit;cursor:pointer}
textarea::placeholder{color:#8F8F8F}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 16px 28px; background: #0E0E0E; font-family: 'Manrope', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; gap: 24px">
  <div style="height: 44px; display: flex; align-items: center; gap: 12px">
    <a href="Stickers.html" aria-label="Back to editing" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex-grow: 1">Caption</h1>
  </div>

  <div style="display: flex; gap: 16px; align-items: flex-start">
    <div style="position: relative; width: 104px; height: 185px; border-radius: 12px; overflow: hidden; flex-shrink: 0">
      <svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true" style="display: block">
        <rect width="360" height="640" fill="#F4C7A1"></rect>
        <circle cx="250" cy="250" r="56" fill="#FF8A5B"></circle>
        <path d="M0 380 C 80 330 160 360 220 400 C 280 440 330 410 360 390 L360 640 L0 640Z" fill="#5F7F6A"></path>
        <path d="M0 450 C 90 410 180 470 260 450 C 310 438 340 445 360 455 L360 640 L0 640Z" fill="#3B5847"></path>
        <path d="M0 540 C 120 510 240 560 360 530 L360 640 L0 640Z" fill="#26392E"></path>
        <path d="M180 220 C 185 160 300 150 318 220 C 334 285 270 330 215 300" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></path>
        <path d="M40 140 C 60 120 80 160 100 140 C 120 120 140 160 160 140" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></path>
        <polygon transform="translate(40 200) scale(2.2) rotate(-10 24 24)" points="24,4 29.6,17.6 44,18.4 32.8,27.6 36.4,42 24,34 11.6,42 15.2,27.6 4,18.4 18.4,17.6" fill="#FFD23F" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"></polygon>
      </svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <label for="caption" style="font-size: 13px; font-weight: 600; color: #B5B5B5">Your caption</label>
      <textarea id="caption" maxlength="150" placeholder="Write a caption…" style="height: 140px; resize: none; border: 0; border-radius: 12px; background: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 16px; line-height: 1.45; padding: 12px; box-sizing: border-box; outline: none"></textarea>
      <span style="font-size: 12px; color: #9A9A9A; align-self: flex-end">0 / 150</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; border-radius: 16px; background: #1A1A1A">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2A2A2A">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span id="opt-onphoto" style="font-size: 15px; font-weight: 600">Show on photo</span>
        <span style="font-size: 13px; color: #A3A3A3">Adds the caption as text on your story</span>
      </div>
      <button role="switch" aria-checked="true" aria-labelledby="opt-onphoto" style="width: 52px; height: 32px; border-radius: 16px; border: 0; background: #FFFFFF; padding: 3px; display: flex; justify-content: flex-end; flex-shrink: 0">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #111111; display: block"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span id="opt-copy" style="font-size: 15px; font-weight: 600">Copy to clipboard</span>
        <span style="font-size: 13px; color: #A3A3A3">Paste it in Instagram if you'd rather type it there</span>
      </div>
      <button role="switch" aria-checked="false" aria-labelledby="opt-copy" style="width: 52px; height: 32px; border-radius: 16px; border: 0; background: #3A3A3A; padding: 3px; display: flex; justify-content: flex-start; flex-shrink: 0">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span>
      </button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Share.html" style="height: 56px; border-radius: 28px; background: #FFFFFF; color: #111111; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a>
</div>


</body>
</html>
