      <path d="M0 540 C 120 510 240 560 360 530 L360 640 L0 640Z" fill="#26392E"></path>

      <path d="M40 140 C 60 120 80 160 100 140 C 120 120 140 160 160 140" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
    </svg>
  </div>

  <div role="tablist" aria-label="Editing tools" style="display: flex; gap: 8px; padding: 4px; background: #1A1A1A; border-radius: 26px">
    <button role="tab" aria-selected="true" style="flex: 1 1 0; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #111111; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">

    <a href="Stickers.dc.html" role="tab" aria-selected="false" style="flex: 1 1 0; height: 44px; border-radius: 22px; color: #D4D4D4; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7z"></path><path d="M21 12h-5a4 4 0 0 0-4 4v5"></path></svg>

  <div style="display: flex; justify-content: space-between; align-items: center">

    <button aria-label="Black" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #111111; border: 1px solid #4A4A4A; box-sizing: border-box; display: block"></span></button>
    <button aria-label="Coral" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #FF5A36; display: block"></span></button>
    <button aria-label="Yellow" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFD23F; display: block"></span></button>
    <button aria-label="Green" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #4ADE80; display: block"></span></button>
    <button aria-label="Blue" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #3B82F6; display: block"></span></button>
    <button aria-label="Violet" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: #8C7BFF; display: block"></span></button>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; height: 44px">
    <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #FFFFFF; display: block; flex-shrink: 0"></span>
    <label for="brush-size" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Brush size</label>
    <input id="brush-size" type="range" min="2" max="24" value="8" style="flex-grow: 1; margin: 0">
    <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; display: block; flex-shrink: 0"></span>
  </div>
</div>
