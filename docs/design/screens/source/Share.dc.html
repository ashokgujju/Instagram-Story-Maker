<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share to story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D4D4D4}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 16px 28px; background: #0E0E0E; font-family: 'Manrope', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
  <div style="height: 44px; display: flex; align-items: center; gap: 12px">
    <a href="Caption.dc.html" aria-label="Back to caption" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex-grow: 1">Ready to share</h1>
  </div>

  <div style="position: relative; width: 290px; height: 516px; border-radius: 20px; overflow: hidden; align-self: center; flex-shrink: 0">
    <svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true" style="display: block">
      <rect width="360" height="640" fill="#F4C7A1"></rect>
      <circle cx="250" cy="250" r="56" fill="#FF8A5B"></circle>
      <path d="M0 380 C 80 330 160 360 220 400 C 280 440 330 410 360 390 L360 640 L0 640Z" fill="#5F7F6A"></path>
      <path d="M0 450 C 90 410 180 470 260 450 C 310 438 340 445 360 455 L360 640 L0 640Z" fill="#3B5847"></path>
      <path d="M0 540 C 120 510 240 560 360 530 L360 640 L0 640Z" fill="#26392E"></path>
      <path d="M180 220 C 185 160 300 150 318 220 C 334 285 270 330 215 300" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
      <path d="M40 140 C 60 120 80 160 100 140 C 120 120 140 160 160 140" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
      <polygon transform="translate(40 200) scale(2.2) rotate(-10 24 24)" points="24,4 29.6,17.6 44,18.4 32.8,27.6 36.4,42 24,34 11.6,42 15.2,27.6 4,18.4 18.4,17.6" fill="#FFD23F" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"></polygon>
    </svg>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 96px; display: flex; justify-content: center">
      <span style="padding: 8px 14px; border-radius: 10px; background: #FFFFFF; color: #111111; font-size: 15px; font-weight: 700; text-align: center">[Your caption]</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <button style="height: 56px; border-radius: 28px; border: 0; background: {{accent}}; color: #111111; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3.5 2.5"></circle><path d="M12 8v8M8 12h8"></path></svg>
    Share to Instagram Stories
  </button>

  <div style="display: flex; gap: 12px">
    <button style="flex: 1 1 0; height: 48px; border-radius: 24px; border: 0; background: #1F1F1F; color: #FFFFFF; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
      Save
    </button>
    <button style="flex: 1 1 0; height: 48px; border-radius: 24px; border: 0; background: #1F1F1F; color: #FFFFFF; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"></path></svg>
      More
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#FFD23F","#8C7BFF","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5A36' };
  }
}
</script>
</body>
</html>
